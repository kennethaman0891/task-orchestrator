# Ruff configuration for the tto Python sidecar.
# Formatting is enforced with `ruff format` (defaults: 4-space indent,
# double quotes) — run `ruff format --check backend` in CI.
target-version = "py310"
line-length = 100
exclude = ["todo-app", "__pycache__"]

[lint]
# Conservative: real errors + undefined names, not stylistic churn.
select = ["E4", "E7", "E9", "F"]
