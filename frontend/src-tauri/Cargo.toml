[package]
name = "tto"
version = "2.3.1"
description = "Task Orchestrator — Terminal Task Orchestrator (native desktop workspace)"
authors = ["Kenneth Aman"]
edition = "2021"
rust-version = "1.77"
license = "MIT OR Apache-2.0 OR GPL-3.0"

[lib]
name = "tto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "unstable", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
native-tls = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
zip = "0.6"
walkdir = "2"
regex = "1"
tempfile = "3"

[features]
# custom-protocol is Tauri's switch between "load devUrl (vite dev server)" and
# "serve the embedded frontendDist". Without it a plain `cargo build --release`
# produces a DEV binary that white-screens whenever the dev server is down.
# Default-on guarantees every hand-built binary embeds the real UI; `tauri dev`
# still works because the CLI builds with --no-default-features + devUrl.
# This was the root cause of the blank-white-screen bug.
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
# panic=unwind (NOT abort): with panic=abort a panic on ANY thread — including a
# background tokio worker like the sidecar command-relay task — aborts the whole
# process with SIGABRT at launch (the intermittent crash we fixed). Tokio already
# isolates panics per-task; unwind lets the panic hook log the cause and keeps the
# app alive instead of killing it.
panic = "unwind"
strip = true
